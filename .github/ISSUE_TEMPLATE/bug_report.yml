name: Reproducible bug
description: Report a guard, document, installation or template problem with shareable inputs.
body:
  - type: markdown
    attributes:
      value: "Do not attach private manuscripts, reviewer identities, credentials or unpublished results. See SECURITY.md for sensitive reports."
  - type: textarea
    id: environment
    attributes:
      label: Environment and version
      description: OS, Python version, Super Writer tag/commit, relevant document tools.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Exact command and synthetic or licensed public input. For templates, include venue, year and official source.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the smallest error output, with private values removed.
    validations:
      required: true
