name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python
        run: python -m compileall -q scripts tools tests
      - name: Synthetic guard regressions
        run: python scripts/smoke_test.py
      - name: Distribution and portable usage
        run: python -m unittest discover -s tests -v
      - name: Public TeX example
        run: python scripts/latex_guard.py examples/synthetic-study/manuscript.tex --markdown
      - name: Build release bundle
        run: python tools/build_release.py
